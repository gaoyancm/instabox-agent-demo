[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "instabox-agent-demo"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "jsonschema==4.26.0"]

[tool.setuptools.packages.find]
include = ["automation*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
